name: Bootstrap Flutter Project

on:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Create Flutter project
        run: |
          flutter create temp_project --project-name gam3eya_app --org com.example --platforms=android
          cp -r temp_project/* .
          cp -r temp_project/.* . 2>/dev/null || true
          rm -rf temp_project

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Bootstrap Flutter project structure"
          git push
